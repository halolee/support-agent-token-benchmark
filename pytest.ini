[pytest]
markers =
    slow: marks tests that require downloaded models or other heavy resources (deselect with `-m 'not slow'`)
    requires_api_key: marks tests that need ANTHROPIC_API_KEY (auto-skipped if missing)
    live_api: marks tests that call the real Anthropic API and cost real money (run with `--run-live-api` only)
testpaths = tests
